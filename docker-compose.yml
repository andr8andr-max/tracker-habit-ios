services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: club
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d club"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      PORT: "4000"
      TZ: Europe/Moscow
      DATABASE_URL: postgresql://postgres:postgres@db:5432/club
      TYPEORM_SYNC: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@club.local}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@club.local}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-owner12345}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    environment:
      API_URL: http://server:4000
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  pgdata:
